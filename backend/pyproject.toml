[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-photo"
version = "1.0.0"
description = "Local-first intelligent photo culling"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0,<3", "pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless>=4.10,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
raw = ["rawpy>=0.24"]
ai = ["onnxruntime>=1.20"]

[project.scripts]
frame = "frame.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frame*"]

[tool.setuptools.package-data]
frame = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
